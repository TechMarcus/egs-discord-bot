name: Deploy Discord Bot
    
on:
  push:
    branches: [main]

jobs:
  docker-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
        
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PSWD }}" | docker login -u "${{ secrets.DOCKER_NAME }}" --password-stdin

      - name: Build Docker image
        run: docker build ./freeGamesScraper -t marcus1939/egs-scraper-app:latest
            
      - name: Push image to DockerHub
        run: docker push marcus1939/egs-scraper-app:latest
    
  server-deploy:
    needs: docker-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
    
      - name: Create SSH key file
        run: |
          echo "${{ secrets.SSH_KEY }}" > ./vps_key
          chmod 600 ./vps_key

      - name: Add VPS host key to known_hosts
        run: |
            mkdir -p ~/.ssh
            ssh-keyscan 130.61.196.156 >> ~/.ssh/known_hosts

      - name: Send Docker-Compose to VPS
        run: scp -i ./vps_key ./docker-compose.yml ubuntu@130.61.196.156:/home/ubuntu/code/egs/





      
      
