name: Deploy Discord Bot
    
on:
  push:
    branches: [main]

jobs:
  docker-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Create .env file
        run: |
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" > .env

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
        
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PSWD }}" | docker login -u "${{ secrets.DOCKER_NAME }}" --password-stdin

      - name: Build Docker image
        run: docker build ./discord_bot -t marcus1939/discord-bot

      - name: Push image to DockerHub
        run: docker push marcus1939/discord-bot
    
  server-deploy:
    needs: docker-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
    
      - name: Create SSH key file
        run: |
          echo "${{ secrets.SSH_KEY }}" > ./vps_key
          chmod 600 ./vps_key

      - name: Add VPS host key to known_hosts
        run: |
            mkdir -p ~/.ssh
            ssh-keyscan 130.61.196.156 >> ~/.ssh/known_hosts

      - name: Send Docker-Compose to VPS
        run: scp -i ./vps_key ./docker-compose.yml ubuntu@130.61.196.156:/home/ubuntu/code/egs/


      - name: Connect to VPS/actions
        run: |
          ssh -i ./vps_key ubuntu@130.61.196.156 '
          rm -r docker-compose.yml.save
          echo "${{ secrets.DOCKER_PSWD }}" | docker login -u "${{ secrets.DOCKER_NAME }}" --password-stdin
          cd code/egs
          docker stop $(docker ps -q)
          sudo docker system prune -a -f
          docker compose pull
          docker compose up -d discord-bot-app
          '





      
      
